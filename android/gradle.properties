# Project-wide Gradle settings.

# Run without daemon — cleans up RAM completely after each build
org.gradle.daemon=false

# JVM arguments — conservative heap for low-RAM systems
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=128m -Dfile.encoding=UTF-8

# Single Ninja job — prevents C++ OOM during NDK compilation
android.ninja.jobs=1

# Single worker — prevents parallel task RAM spike
org.gradle.workers.max=1

# Disable parallel to save memory
org.gradle.parallel=false

# AndroidX package structure
android.useAndroidX=true

# Skip PNG crunching on debug builds
android.enablePngCrunchInReleaseBuilds=true
android.enablePngCrunchInDebugBuilds=false

# Target arm64 architecture only for physical Android device
reactNativeArchitectures=arm64-v8a

# New architecture enabled
newArchEnabled=true

# Hermes JS engine enabled
hermesEnabled=true

# Edge-to-edge display support
edgeToEdgeEnabled=true